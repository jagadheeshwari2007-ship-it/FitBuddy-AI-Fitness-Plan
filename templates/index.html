{% extends "base.html" %}

{% block title %}FitBuddy - Create Your Fitness Plan{% endblock %}

{% block content %}

<section class="hero">
    <div class="hero-content">
        <h1>💪 Create Your Personal Fitness Plan</h1>

        <p>
            Enter your details and let FitBuddy generate
            a personalized 7-day workout and nutrition plan.
        </p>
    </div>
</section>

<section class="card form-card">

    <h2>Fitness Details</h2>

    <form action="/generate" method="post">

        <div class="form-group">
            <label for="name">Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >
        </div>

        <div class="form-group">
            <label for="user_id">User ID</label>
            <input
                type="text"
                id="user_id"
                name="user_id"
                placeholder="Example: FB001"
                required
            >
        </div>

        <div class="form-row">

            <div class="form-group">
                <label for="age">Age</label>
                <input
                    type="number"
                    id="age"
                    name="age"
                    min="13"
                    max="100"
                    placeholder="Age"
                    required
                >
            </div>

            <div class="form-group">
                <label for="weight">Weight (kg)</label>
                <input
                    type="number"
                    id="weight"
                    name="weight"
                    min="20"
                    max="300"
                    step="0.1"
                    placeholder="Weight"
                    required
                >
            </div>

        </div>

        <div class="form-group">
            <label for="goal">Fitness Goal</label>

            <select id="goal" name="goal" required>
                <option value="">Select your goal</option>
                <option value="weight loss">Weight Loss</option>
                <option value="muscle gain">Muscle Gain</option>
                <option value="general fitness">General Fitness</option>
                <option value="strength">Strength</option>
                <option value="endurance">Endurance</option>
            </select>
        </div>

        <div class="form-group">
            <label for="intensity">Workout Intensity</label>

            <select id="intensity" name="intensity" required>
                <option value="">Select intensity</option>
                <option value="beginner">Beginner</option>
                <option value="moderate">Moderate</option>
                <option value="high">High</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">
            🚀 Generate My 7-Day Plan
        </button>

    </form>

</section>

{% endblock %}
