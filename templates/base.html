<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}FitBuddy{% endblock %}</title>

    <link
    rel="stylesheet"
    href="{{ url_for('static', path='styles.css') }}"
>
</head>

<body>

    <header class="navbar">
        <div class="container navbar-content">
            <a href="/" class="logo">
                💪 FitBuddy
            </a>

            <nav>
                <a href="/">Home</a>
                <a href="/nutrition-tip">Nutrition Tip</a>
                <a href="/view-all-users">All Users</a>
            </nav>
        </div>
    </header>

    <main class="container main-content">

        {% block content %}
        {% endblock %}

    </main>

    <footer class="footer">
        <div class="container">
            <p>
                FitBuddy — AI Fitness Plan Generator
            </p>
        </div>
    </footer>

</body>
</html>
